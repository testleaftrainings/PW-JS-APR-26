# Data Parameterization with JSON

---
1. 

### **Definition**
JSON --> JavaScript Object Notation.

What is JSON?

JSON stands for JavaScript Object Notation.

It is a format used to store and transfer data.

Simple meaning:
JSON helps computers store data in an organized way using key and value pairs.

Real Life Example

Think about a student form.

Student Name : Hari
Age : 22
City : Chennai
Mob : 989898989

JSON stores data exactly like this.

Example:

{
  "name": "Hari",
  "age": 22,
  "city": "Chennai",
  "Mob" : "989898989"
}

Understanding Key and Value

In JSON:

{
  "name": "Hari"
}

"name" → Key
"Hari" → Value

Key:
Label/field name

Value:
Actual data stored

Why JSON is Used?

JSON is used because:

Easy for humans to read
Easy for computers to understand
Used in APIs
Used in automation testing
Used for data sharing between frontend and backend

Where We Use JSON in Automation?

Test Data
API Request/Response
Configuration files
Environment data

Example:

{
  "username": "admin",
  "password": "test123"
}

Used in login automation.

