Class and Object:


Real life example of Class and Object, Properties and Methods:

###  What is a *Class*?

A *class* is like a *blueprint* or *template* for creating something.

Example with application login :
-----------------------------------

property :
---------
Represents the information or data related to a particular page or object
(e.g., username, password, URL).

method :
-------- 
Represents the actions or operations performed on that page or object
(e.g., fill a field, click a button, submit a form).

******************************************************************************************

Sample Program :
--------------



****************************************************************************************
Constructor:

Definition
A constructor in TypeScript is a method named constructor() that runs once at the time of object creation and sets up the initial state of the object.
Or a Special method to initialize the object

*******************************************************************************************


class LoginPage{

//Properties: (Specific class related data)
browserName = "Chrome"
url = "https://leaftaps.com/opentaps/control/main"
username = "democsr2"
password = "crmsfa"

//Method : (Specific class related actions )
launch(){
console.log("Launch the browser Chrome")
}

loadur(){
console.log("Load the url")
}

fill(){ // Method block--> block of code to perform an action

//Actionables
//fill method
//use the properties "username" and "password" to perform the action to fill the login form

console.log("Fill username and password in the text box")


}

click(){
//Actionables
//click method

console.log("Click the submit button")

}
}


const lp = new LoginPage() // ✔️ Memory is allocated //syntax to create an object(reference/ instance/copy) for a class to call the methods(actionable blocks) inside the class 

lp.launch()
lp.loadurl()
lp.fill()
lp.click()


