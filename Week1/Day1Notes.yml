Naming Conventions in JavaScript

=> File Names :
--------------

camelCase

Example:

loginPage.js
userProfile.js

=> Variables :
-------------

camelCase

Start with a lowercase letter

Example:

isActive
userName
totalAmount

=> Classes
-----------

PascalCase

Start with an uppercase letter

Example:

class LoginPage { }
class UserService { }
