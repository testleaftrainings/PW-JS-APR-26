Real-life Ananlogy on the difference between var,let,const :

🟨 var — You can rename the box and change the food
🍱 Lunch box analogy

Declaration → Buying a lunch box and naming it x
Redeclaration → Writing the name x again on the same lunch box
Assignment → Putting food in the box
Reassignment → Replacing the food with something else

With var, the lunch box is flexible — you can rename it again and again and change what’s inside.

var rules :

| Aspect                    | Redeclaration | Reassignment |
| ------------------------- | ------------- | ------------ |
| What repeats?             | Variable name | Value        |
| Uses `var` keyword again? | Yes           | No           |
| Changes memory?           | No            | No           |
| Allowed with `var`?       | ✅ Yes         | ✅ Yes        |

Example:
-------

var x = 10;   // Declaration + assignment
var x = 20;  // ✅ Redeclaration allowed

x = 30;      // ✅ Reassignment allowed


------------------------------------------------------------------------

🟦 let — You can change food, but you cannot rename the box
🍱 Lunch box analogy

Declaration → Buying a lunch box and naming it y
Redeclaration → ❌ Not allowed (you cannot write the name y again on the same box)
Assignment → Putting food in the box
Reassignment → Replacing the food with something else

| Aspect                    | Redeclaration | Reassignment |
| ------------------------- | ------------- | ------------ |
| What repeats?             | Variable name | Value        |
| Uses `let` keyword again? | Yes ❌ (Error) | No           |
| Changes memory?           | No            | No           |
| Allowed with `let`?       | ❌ No          | ✅ Yes        |

Example :
--------

let y = 10;   // Declaration + assignment
let y = 20;  // ❌ Error (redeclaration not allowed)

y = 30;      // ✅ Reassignment allowed

------------------------------------------------------------------------

🟥 const — You cannot change the box or the food
🍱 Lunch box analogy

Declaration → Buying a lunch box and naming it z
Assignment → Putting food in the box (must be done immediately if not throws error in const)
Redeclaration → ❌ Not allowed
Reassignment → ❌ Not allowed

Once food is placed, that lunch box becomes sealed forever 🔒

| Aspect                      | Redeclaration | Reassignment |
| --------------------------- | ------------- | ------------ |
| What repeats?               | Variable name | Value        |
| Uses `const` keyword again? | Yes ❌ (Error) | No ❌ (Error) |
| Changes memory?             | No            | No           |
| Allowed with `const`?       | ❌ No          | ❌ No         |

Example :

const z = 50;  // Declaration + assignment is mandatory
const z = 60; // ❌ Error (no redeclaration)

z = 70;       // ❌ Error (no reassignment)

------------------------------------------------------------------------

One-line summary:

var → Rename the box & change the food

let → Keep the same box, change the food

const → Same box, same food forever

***************************************************************************************************************
