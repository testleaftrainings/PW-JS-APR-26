Example 2: Sequential Jobs

Sometimes Job B should start only after Job A succeeds.

Use:

needs:

Example:

name: Sequential Jobs

on:
  push:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Building..."

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - run: echo "Testing..."
Flow
Build
  │
Success
  │
  ▼
Test

If Build fails:

Build ❌

Test skipped
