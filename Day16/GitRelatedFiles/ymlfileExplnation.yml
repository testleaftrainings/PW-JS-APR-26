

## 📝 Workflow Name

name: Playwright Tests

* This is just the **name** of the workflow (shows up in GitHub Actions tab).

---

## When it Runs


on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
```

* Runs **automatically** whenever:

  * You push code to `main` or `master` branches.
  * You open a pull request into `main` or `master`.

✅ Add this under on:
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  schedule:
    - cron: "0 21 * * *"


So your full trigger section becomes:

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: "0 21 * * *"

🕘 What does "0 21 * * *" mean?

GitHub Actions uses UTC time.

0 21 * * * = 9:00 PM UTC

India (IST) is UTC + 5:30
So this runs at:

2:30 AM IST every day

If you want 11:00 PM IST, use:

17:30 UTC → "30 17 * * *"


Example for 11 PM IST:

schedule:
  - cron: "30 17 * * *"

🧪 What will happen nightly?

Every night:

GitHub wakes up
→ Starts Ubuntu runner
→ Installs Node & Playwright
→ Runs all tests
→ Generates Playwright report
→ Stores report for 30 days


Even if no one pushes code.

🎯 One-line summary

Add schedule with a cron expression under on: to run Playwright tests automatically every night.

---

## Job Definition

```yaml
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
```

* Defines a **job** called `test`.
* Runs on a fresh **Ubuntu Linux** machine in GitHub’s cloud.
* Will stop if it runs longer than **60 minutes**.

---

## Steps in the Job

### 1. Checkout Code

```yaml
- uses: actions/checkout@v4
```

* Downloads your repository code into the workflow environment.

### 2. Setup Node.js

```yaml
- uses: actions/setup-node@v4
  with:
    node-version: lts/*
```

* Installs **Node.js (latest LTS version)** → needed for Playwright.

### 3. Install Dependencies

```yaml
- name: Install dependencies
  run: npm ci
```

* Runs `npm ci` (clean install of dependencies from `package-lock.json`).

### 4. Install Playwright Browsers

```yaml
- name: Install Playwright Browsers
  run: npx playwright install --with-deps
```

* Downloads Playwright’s browsers (Chromium, Firefox, WebKit) + system deps.

### 5. Run Playwright Tests

```yaml
- name: Run Playwright tests
  run: npx playwright test
```

* Executes all your **Playwright test files**.

### 6. Save Test Report

```yaml
- uses: actions/upload-artifact@v4
  if: ${{ !cancelled() }}
  with:
    name: playwright-report
    path: playwright-report/
    retention-days: 30
```

* Uploads the **Playwright HTML test report** as an artifact.
* Keeps it for **30 days**.
* You can download it from the GitHub Actions run page.

---

✅ **In simple terms:**
This workflow makes sure that every time you push or open a PR, your Playwright tests are automatically run on GitHub’s servers. If tests fail, you’ll see it in the Actions tab, and you can also download the test report.



---------------------------------------

You do not need the CLI to create the schedule. The schedule itself is defined in the workflow YAML, but GitHub provides a browser editor for that file.

What you can do in the UI

1. Open your repository on GitHub.

2. Go to Actions → choose the workflow → Edit workflow (pencil icon), or navigate to `.github/workflows/your-workflow.yml` and click Edit.

3. Add a `schedule` trigger to the YAML.

4. Commit the change directly from the browser (to a branch or via a PR).

5. GitHub will start running the workflow on the schedule after the commit reaches the target branch.

Minimal scheduled workflow

For IST (Chennai): convert to UTC

GitHub cron schedules are interpreted in UTC, not local time.

| Desired IST time  | UTC equivalent    | Cron           |
| ----------------- | ----------------- | -------------- |
| 09:00 IST daily   | 03:30 UTC daily   | '30 3 * * *'   |
| 23:00 IST daily   | 17:30 UTC daily   | '30 17 * * *'  |
| Mon–Fri 10:00 IST | 04:30 UTC Mon–Fri | '30 4 * * 1-5' |

Important: If you want 09:00 IST, use `30 3 * * *`, not `0 9 * * *`.

Limitations / gotchas

1. GitHub Actions schedules are best-effort; runs can be delayed during platform load.

2. Scheduled workflows only run if the workflow file exists on the repository’s default branch (for public repos this is straightforward; for private repos the same practical rule applies for most setups).

3. The repository must have Actions enabled, and billing/usage limits can affect execution on private repos.

4. There is no separate “scheduler UI” where you click calendar times; the schedule is configured in the workflow YAML, which you can edit entirely through the web interface.

